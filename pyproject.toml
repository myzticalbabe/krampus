[project]
name = "krampus"
version = "0.2.1"
description = "PROJECT KRAMPUS: MellifluousML, Madi, Gamora (+Berzerker AIO), Eve, Lillith — one verified composition"
readme = "README.md"
authors = [{name = "Azazael"}]
license = {text = "CDDL-1.1"}
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved Apache Software License",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "madi>=0.1.0",
    "eve-unleashed>=3.16.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[project.scripts]
krampus = "krampus:main"

[tool.setuptools.packages.find]
include = ["krampus*"]

# cradle's lesson, learned again here: `krampus doctor` reads this file by path, so a
# wheel without it installs a command that crashes. Measured on 0.2.0.
[tool.setuptools.package-data]
krampus = ["KRAMPUS.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
