name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    # The check-run name IS the status-check context. Branch protection on main
    # requires the context `ci`, and until a workflow emitted it, main was
    # permanently blocked no matter whether CI passed. The job id stays `test`;
    # the name is what GitHub reports.
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # madi is not published on PyPI yet, so the resolver cannot see the
          # `madi>=0.1.0` requirement in pyproject.toml. Install it from git
          # first; the resolver then treats the requirement as satisfied. This
          # is the same prerequisite .github/workflows/test.yml already uses.
          pip install "git+https://github.com/myzticalbabe/madi.git@v0.1.0"
          if [ -f pyproject.toml ]; then pip install -e .[test] 2>/dev/null || pip install -e .; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
      - name: Run tests
        run: |
          if [ -d tests ]; then python -m pytest tests/ -v --tb=short; fi
      - name: Type check
        run: |
          if [ -f pyproject.toml ] && grep -q "basedpyright\|pyright" pyproject.toml; then
            pip install basedpyright && basedpyright --version
          fi
