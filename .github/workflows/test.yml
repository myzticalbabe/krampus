name: Test

on:
  push:
    branches: [main]
    paths:
      - 'krampus/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # INTERIM: madi is not on PyPI yet, so the resolver cannot see
          # it. Install from git first; pip then treats `madi>=0.1.0` as
          # satisfied. Delete this line the day madi lands on the index.
          pip install "git+https://github.com/myzticalbabe/madi.git@v0.1.0"
          pip install -e ".[test]"

      - name: Run test suite
        run: |
          python -m pytest tests/ -q
